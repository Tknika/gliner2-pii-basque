[project]
name = "gliner2-pii-basque"
version = "2.0.0"
description = "Fine-tuning GLiNER2-PII for Basque: synthetic PII data, LoRA + experience replay, evaluation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
# Exact versions used to train and evaluate tknika/gliner2-PII-basque-v2
dependencies = [
    "gliner2[local]==2.1.0",
    "peft==0.21.2",
    "torch==2.14.1",
    "transformers==5.19.0",
    "datasets==5.1.0",
    "pandas==3.0.6",
    "huggingface_hub==2.2.0",
    "numpy",
]

[project.optional-dependencies]
# Only needed to rebuild data/sources/ from the original providers
sources = ["osmium", "requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gliner2_pii_basque"]
